<section class="root-start-page" aria-label="TunSociety start">
  <a class="root-start-button" [routerLink]="startRoute" aria-label="Start TunSociety">
    <span class="root-start-mark">
      <img src="/assets/logo.png" alt="" aria-hidden="true">
    </span>
    <span class="root-start-copy">
      <strong>Start TunSociety</strong>
      <small>Enter the workspace</small>
    </span>
    <span class="root-start-arrow" aria-hidden="true">
      <app-admin-icon name="external-link" [size]="18"></app-admin-icon>
    </span>
  </a>
</section>
